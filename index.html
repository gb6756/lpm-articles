<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPM-Articles</title>
    <!-- Parseur CSV spécialisé -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
	<link rel="stylesheet" media="screen" href="style.css">
    <style>
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 style="margin:0;">Articles Petit Moulinais</h1>
    </header>
    <!-- Filtres -->
    <div class="card">
        <h3 style="margin-top:0;">🔍 Filtres de recherche</h3>
        <div class="filter-grid">
            <div class="filter-item"><label>Numéro</label><input type="text" id="fnumero" oninput="applyFilters()"></div>
            <div class="filter-item"><label>Année</label><input type="text" id="fannee" oninput="applyFilters()"></div>
            <div class="filter-item"><label>Mois</label><input type="text" id="fmois" oninput="applyFilters()"></div>
            <div class="filter-item"><label>Auteur</label><input type="text" id="fauteur" oninput="applyFilters()"></div>			
			<div class="filter-item"><label>Titre</label><input type="text" id="ftitre" oninput="applyFilters()"></div>
			<div class="filter-item"><label>Mots clés</label><input type="text" id="fmotscle" oninput="applyFilters()"></div>	
        </div>
    </div>
	<div class="results-info">
		<span id="linkCount">Chargement du catalogue...</span>
	</div>
	<div id="articlesGrid" class="articles-grid"></div>
	<!-- NOUVEAU : Zone de pagination -->
<div id="pagination" class="pagination-container"></div>
<script type="text/javascript" src="app.js"></script>
<script>
</script>
</body>
</html>
